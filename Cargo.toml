[package]
name = "slip"
version = "0.1.0"
edition = "2024"
default-run = "slip-tui"
description = "Chat over email: any IMAP/SMTP mailbox becomes a messenger"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dingguanglei/Slip"
keywords = ["email", "chat", "imap", "smtp", "tui"]
categories = ["command-line-utilities", "email"]

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
crossterm = "0.28"
crypto_box = { version = "0.9", features = ["std"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
imap = { version = "2.4", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "rustls-tls"] }
mailparse = "0.15"
mime_guess = "2.0"
ratatui = "0.29"
rustls = { version = "0.23.18", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
