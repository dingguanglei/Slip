name: Desktop packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Desktop ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            package: mac
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            package: win
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: linux-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve package directory and validate release tag
        id: version
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const version = require('./desktop/package.json').version;
          if (process.env.GITHUB_REF.startsWith('refs/tags/v') && 'v' + version !== process.env.GITHUB_REF_NAME) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `directory=dist/v${version}\n`);
          JS
      - name: Install desktop packaging dependencies
        run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Build macOS or Windows backend
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin slip-web
      - name: Build Linux backend for glibc 2.35
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/slip-build-tools"
          "$RUNNER_TEMP/slip-build-tools/bin/pip" install cargo-zigbuild==0.23.4 ziglang==0.13.0
          export PATH="$RUNNER_TEMP/slip-build-tools/bin:$PATH"
          cargo zigbuild --release --locked --target ${{ matrix.target }}.2.35 --bin slip-web
      - name: Check Unix backend executable
        if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/slip-web --help
      - name: Check Windows backend executable
        if: runner.os == 'Windows'
        run: target/${{ matrix.target }}/release/slip-web.exe --help
      - name: Check Windows child shutdown
        if: runner.os == 'Windows'
        shell: cmd
        run: target\${{ matrix.target }}\release\slip-web.exe --parent-stdio <NUL >NUL
      - name: Package desktop application
        run: node desktop/scripts/package.cjs ${{ matrix.package }}
      - name: Create distributable
        run: python desktop/scripts/archive.py ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.package }}
          path: |
            ${{ steps.version.outputs.directory }}/*.zip
            ${{ steps.version.outputs.directory }}/*.deb
          if-no-files-found: error
          retention-days: 7
  bundle:
    name: Collect desktop packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/bundle
          merge-multiple: true
      - name: Verify packages and write checksums
        shell: bash
        run: |
          cd dist/bundle
          shopt -s nullglob
          assets=(*.zip *.deb)
          test "${#assets[@]}" -eq 4
          sha256sum "${assets[@]}" > SHA256SUMS
          printf 'Commit: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Slip-desktop-${{ github.sha }}
          path: dist/bundle/*
          if-no-files-found: error
          retention-days: 14
