name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - name: Verify asset count and create checksums
        shell: bash
        run: |
          cd dist/release
          shopt -s nullglob
          assets=(*.zip *.deb)
          test "${#assets[@]}" -eq 4
          sha256sum "${assets[@]}" > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.zip
            dist/release/*.deb
            dist/release/SHA256SUMS
          body_path: docs/RELEASE.md
          fail_on_unmatched_files: true
