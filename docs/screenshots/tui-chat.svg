<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Slip TUI chat screen</title>
  <desc id="desc">A terminal-style mock screenshot of Slip with a contact pane, an encrypted conversation, media lines, and delivery states.</desc>
  <rect width="920" height="620" rx="18" fill="#eef3f4"/>
  <rect x="28" y="28" width="864" height="564" rx="14" fill="#102026"/>
  <rect x="28" y="28" width="864" height="34" rx="14" fill="#20343b"/>
  <circle cx="52" cy="45" r="6" fill="#ff5f57"/>
  <circle cx="74" cy="45" r="6" fill="#ffbd2e"/>
  <circle cx="96" cy="45" r="6" fill="#28c840"/>
  <text x="460" y="50" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#9fb1b7">slip-tui</text>

  <line x1="310" y1="62" x2="310" y2="470" stroke="#43565c"/>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" fill="#d7e6e8">
    <text x="58" y="100" font-size="22" font-weight="700" fill="#e7fbff">Slip</text>
    <text x="128" y="100" font-size="14" fill="#7e9197">alice@qq.com</text>

    <text x="58" y="152" font-weight="700" fill="#78a8ff">› bob@gmail.com</text>
    <text x="262" y="152" font-weight="700" fill="#ff8c50">(2)</text>
    <text x="82" y="180" font-size="14" fill="#7f9399">bob: one comment on…</text>

    <text x="58" y="228" fill="#9db0b6">carol@163.com</text>
    <text x="82" y="256" font-size="14" fill="#7f9399">me: [image v3.png]</text>

    <text x="58" y="304" fill="#9db0b6">dave@qq.com</text>
    <text x="82" y="332" font-size="14" fill="#7f9399">dave: 收到，明天见</text>
  </g>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#d7e6e8">
    <text x="348" y="100" font-weight="700" fill="#e7fbff">bob@gmail.com</text>
    <text x="560" y="100" font-size="15" fill="#7f9399">🔒 encrypted</text>

    <text x="348" y="164" font-weight="700" fill="#d39a2c">me</text>
    <text x="394" y="164" fill="#6f8389">14:02</text>
    <text x="470" y="164" fill="#6f8389">🔒</text>
    <text x="504" y="164" fill="#2ecf8e">✓</text>
    <text x="368" y="196" fill="#d7e6e8">did you get the mockups?</text>

    <text x="348" y="256" font-weight="700" fill="#00b7c7">bob@gmail.com</text>
    <text x="560" y="256" fill="#6f8389">14:05</text>
    <text x="636" y="256" fill="#6f8389">🔒</text>
    <text x="368" y="288" fill="#d7e6e8">yes — one comment on the header</text>
    <text x="368" y="322" fill="#9db0b6">🖼 image mockup-v2.png (1.2 MB) · Ctrl+O opens</text>

    <text x="348" y="382" font-weight="700" fill="#00b7c7">bob@gmail.com</text>
    <text x="560" y="382" fill="#6f8389">14:06</text>
    <text x="636" y="382" fill="#6f8389">🔒</text>
    <text x="368" y="414" fill="#9db0b6">🎵 audio note.ogg (240 KB) · Ctrl+O opens</text>
  </g>

  <g font-family="SF Mono, Menlo, Consolas, monospace">
    <line x1="28" y1="470" x2="892" y2="470" stroke="#43565c"/>
    <text x="58" y="512" font-size="18" fill="#00b894">›</text>
    <text x="86" y="512" font-size="18" font-weight="700" fill="#ffffff">sounds good @./v3.png</text>
    <rect x="326" y="490" width="12" height="28" fill="#00b894"/>
    <text x="58" y="546" font-size="14" fill="#8fa0a6">to: bob@gmail.com  ·  @path attaches  ·  / commands</text>
    <text x="58" y="578" font-size="14" fill="#2ecf8e">● listening (IMAP IDLE)</text>
    <text x="300" y="578" font-size="14" fill="#8fa0a6">Sent to bob@gmail.com 🔒</text>
  </g>
</svg>
